<div class="box box-info">
    <div class="box-body">
        <!-- Ajoutez d'autres champs ici selon vos besoins -->
        <div class="form-group row">
            <label for="name" class="col-sm-2 control-label">Name</label>
            <div class="col-sm-6">
                <input type="text" autocomplete="off" class="form-control" name="name" [(ngModel)]="member.name">
            </div>
        </div>
        <div class="form-group row">
            <label for="lastName" class="col-sm-2 control-label">Last Name</label>
            <div class="col-sm-6">
                <input type="text" autocomplete="off" class="form-control" name="lastName" [(ngModel)]="member.lastName">
            </div>
        </div>
        <div class="form-group row">
            <label for="specialite" class="col-sm-2 control-label">Speciality</label>
            <div class="col-sm-6">
                <input type="text" autocomplete="off" class="form-control" name="specialite" [(ngModel)]="member.specialite">
            </div>
        </div>
        <div class="form-group row">
            <label for="details" class="col-sm-2 control-label">Details</label>
            <div class="col-sm-6">
                <textarea autocomplete="off" class="form-control" name="details" [(ngModel)]="member.details"></textarea>
            </div>
        </div>
        <div class="form-group row">
            <label for="image" class="col-sm-2 control-label">Image</label>
            <div class="col-sm-6">
                <img [src]="selectedImage ? selectedImage : 'http://localhost:8001/attchments/members/' + member.image" alt="{{ member.name }} {{ member.lastName }}" style="width:140px;">
                <input type="file" class="form-control-file" name="image" (change)="onFileChange($event)">
            </div>
            
        </div>
        <!-- Fin des champs supplémentaires -->
        <div class="form-group row">
            <label for="" class="col-sm-2 control-label"></label>
            <div class="col-sm-6">
                <button type="submit" class="btn btn-success pull-left" (click)="updateMember()">Submit</button>
            </div>
        </div>
    </div>
</div>
