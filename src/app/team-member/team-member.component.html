<div class="row">
    <div class="col-md-12">

        

        <div class="box box-info">
            <div class="box-body table-responsive">

                <div id="example1_wrapper" class="dataTables_wrapper form-inline dt-bootstrap no-footer"><div class="row"><div class="col-sm-6"><div class="dataTables_length" id="example1_length"><label>Show <select name="example1_length" aria-controls="example1" class="form-control input-sm"><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select> entries</label></div></div><div class="col-sm-6"><div id="example1_filter" class="dataTables_filter"><label>Search:<input type="search" class="form-control input-sm" placeholder="" aria-controls="example1"></label></div></div></div><div class="row"><div class="col-sm-12"><table id="example1" class="table table-bordered table-striped dataTable no-footer" role="grid" aria-describedby="example1_info">
                    <thead>
                        <tr role="row"><th class="sorting_asc" tabindex="0" aria-controls="example1" rowspan="1" colspan="1" aria-sort="ascending" aria-label="SL: activate to sort column descending" style="width: 138.4px;">SL</th><th class="sorting" tabindex="0" aria-controls="example1" rowspan="1" colspan="1" aria-label="Photo: activate to sort column ascending" style="width: 128.4px;">Photo</th><th class="sorting" tabindex="0" aria-controls="example1" rowspan="1" colspan="1" aria-label="Name: activate to sort column ascending" style="width: 292.4px;">Name</th><th class="sorting" tabindex="0" aria-controls="example1" rowspan="1" colspan="1" aria-label="Designation: activate to sort column ascending" style="width: 359.4px;">Specialite</th><th width="140" class="sorting" tabindex="0" aria-controls="example1" rowspan="1" colspan="1" aria-label="Action: activate to sort column ascending" style="width: 140.2px;">Action</th></tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let teamMember of TeamData" role="row" class="odd">
                            <td class="sorting_1">{{ teamMember.id }}</td>
                            <td style="width:150px;"><img src="http://localhost:8001/attchments/members/{{ teamMember.image }}" alt="{{ teamMember.name }} {{ teamMember.lastName }}" style="width:140px;"></td>
                            <td>{{ teamMember.name +"  "+ teamMember.lastName }}</td>
                            <td>{{ teamMember.specialite }}</td>
                            <!--td> teamMember.specialite</td-->
                            <td>
                              <a href="https://demo.phpscriptpoint.com/travelfresh/admin/team_member/edit/{{ teamMember.id }}" class="btn btn-primary btn-xs" style="margin:1%;">Edit</a>
                              <a href="https://demo.phpscriptpoint.com/travelfresh/admin/team_member/delete/{{ teamMember.id }}" class="btn btn-danger btn-xs" onclick="return confirm('Are you sure?');">Delete</a>
                            </td>
                        </tr>
                       </tbody>
